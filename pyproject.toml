[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-retrieval-bench"
version = "0.3.0"
description = "Honest retrieval benchmark lane: BM25, TF-IDF dense, RRF hybrid, nDCG/Recall/P@k/R-precision/MRR/MAP, fairness gates, hash-chained receipts. Fail closed."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

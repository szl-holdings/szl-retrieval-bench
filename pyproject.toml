[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-retrieval-bench"
version = "0.3.0"
description = "Honest retrieval benchmark lane: BM25, TF-IDF dense, RRF hybrid, nDCG/Recall/P@k/R-precision/MRR/MAP, fairness gates, hash-chained receipts. Fail closed."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-retrieval-bench"
Source = "https://github.com/szl-holdings/szl-retrieval-bench"
Issues = "https://github.com/szl-holdings/szl-retrieval-bench/issues"
Changelog = "https://github.com/szl-holdings/szl-retrieval-bench/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_retrieval_bench"] # wheel top-level import names; the release gate fails if the built wheel differs
